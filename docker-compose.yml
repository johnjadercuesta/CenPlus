version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cenplus_db
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  web:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/cenplus_db
      JWT_SECRET: cenplus-dev-secret
      NODE_ENV: development
    depends_on:
      - db
    volumes:
      - .:/app

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/cenplus_db
    depends_on:
      - db
    volumes:
      - .:/app

  social_api:
    build:
      context: .
      dockerfile: social-trends-api/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./social-trends-api:/app
    depends_on:
      - db

volumes:
  db_data:
